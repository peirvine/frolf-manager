name: Check PR title

# The app's version is worked out from commit messages, and squash merges use the PR title, so it has to follow
# Conventional Commits (see scripts/checkCommitMsg.js)
"on":
  pull_request:
    types: [opened, edited, reopened, synchronize]

jobs:
  pr_title:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Check the PR title
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          printf '%s\n' "$PR_TITLE" > "$RUNNER_TEMP/title.txt"
          node scripts/checkCommitMsg.js "$RUNNER_TEMP/title.txt"
